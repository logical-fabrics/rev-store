# repo-patrol: Dependabot の npm 系の PR が、既存の依存の版の更新だけで、新しい版の公開者・install script・公開日に問題がないかを確かめる。
# 正本は logical-fabrics/skills の .claude/skills/repo-patrol/workflows/。導入先では .github/workflows/ に写す（手で編集しない）
# ruleset の required check に足すのは、誤検知がないことを運用で確かめてから人が行う（check の名前は dependency-check）
name: repo-patrol dependency check

# pull_request_target なので、この workflow の定義は PR ではなく base のものが動く（PR が check を外したり書き換えたりできない）。
# そのかわり、PR のコードは決して実行しない。PR のチェックアウトは git で読むだけにし、install・run・PR のスクリプトを足さない
on:
  pull_request_target:
  # 公開から 4 日未満で落ちた検査を、4 日たったら再実行する（recheck のジョブ）。08:37 JST: close の 08:17 と巡回の 09:07 の間
  schedule:
    - cron: "37 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    # 人の PR は依存の追加などを正当に含むので対象にしない。skip されたジョブは required check を満たす
    if: startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the pull request as data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # 検査される PR が検査そのものや許すパスを書き換えられないように、base のコミットから取り出して使う
      - name: Take the checker from the base commit
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASE_SHA" .claude/skills/repo-patrol .claude/repo-patrol.md | tar -x -C "$RUNNER_TEMP/base"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the dependency update
        run: node "$RUNNER_TEMP/base/.claude/skills/repo-patrol/scripts/dependency-check.mjs" "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # 落ちた理由を annotations にも出す（巡回は check run の annotations で読む）
          REPO_PATROL_ANNOTATE: "1"

  recheck:
    # PR のイベントでは動かない（schedule と手動だけ）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 再実行（actions: write）は、このジョブにだけ与える。PR のコードは読みも実行もしない
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Re-run the checks that waited for the age of the versions
        run: node .claude/skills/repo-patrol/scripts/recheck.mjs "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
